<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Turno – CRR CONTROL DE PLAGAS</title>
    <style>
        /* Estilos generales y layout */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            margin-top: 40px;
            width: 100%;
            max-width: 540px;
            padding: 32px 28px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border-radius: 10px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 26px;
            color: #1e1e1e;
            text-align: center;
        }

        form {
            display: grid;
            gap: 14px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333333;
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #c00;
            box-shadow: 0 0 0 3px rgba(204, 0, 0, 0.1);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
        }

        .radio-group label {
            font-weight: 500;
            margin: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .checkbox-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 14px;
            line-height: 1.4;
        }

        .checkbox-row input {
            margin-top: 3px;
        }

        .submit-btn {
            background-color: #d30000;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            width: 100%;
        }

        .submit-btn:hover {
            background-color: #b10000;
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        .footnote {
            margin-top: 10px;
            text-align: center;
            font-size: 12px;
            color: #666666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Solicitud de Turno – CRR CONTROL DE PLAGAS</h1>
        <form id="turnoForm">
            <div>
                <label for="nombre">Nombre y apellido *</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
            </div>
            <div>
                <label for="telefono">Teléfono de contacto *</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 11 3681 0124" required>
            </div>
            <div>
                <label for="zona">Zona / Localidad *</label>
                <input type="text" id="zona" name="zona" placeholder="Ej: Lomas de Zamora" required>
            </div>
            <div>
                <label for="servicio">Tipo de servicio</label>
                <select id="servicio" name="servicio">
                    <option value="Fumigación hogareña">Fumigación hogareña</option>
                    <option value="Fumigación comercio">Fumigación comercio</option>
                    <option value="Desratización">Desratización</option>
                    <option value="Desinfección">Desinfección</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            <div>
                <label>Tipo de propiedad</label>
                <div class="radio-group">
                    <label><input type="radio" name="propiedad" value="Casa"> Casa</label>
                    <label><input type="radio" name="propiedad" value="Departamento"> Departamento</label>
                    <label><input type="radio" name="propiedad" value="Comercio"> Comercio</label>
                    <label><input type="radio" name="propiedad" value="Edificio"> Edificio</label>
                </div>
            </div>
            <div>
                <label for="fecha">Fecha preferida *</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>
            <div>
                <label for="franja">Franja horaria preferida</label>
                <select id="franja" name="franja">
                    <option value="Mañana">Mañana</option>
                    <option value="Tarde">Tarde</option>
                    <option value="Fin de semana">Fin de semana</option>
                </select>
            </div>
            <div>
                <label for="descripcion">Descripción del problema</label>
                <textarea id="descripcion" name="descripcion" placeholder="Contanos brevemente el problema (opcional)"></textarea>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="acepto" name="acepto" required>
                <label for="acepto">Acepto que me contacten por WhatsApp para coordinar el turno *</label>
            </div>
            <button type="submit" class="submit-btn">Enviar por WhatsApp</button>
            <div class="footnote">Zona Sur – Buenos Aires | Atención a hogares, comercios y edificios</div>
        </form>
    </div>

    <script>
        const form = document.getElementById('turnoForm');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            // Validación manual de campos obligatorios
            const nombre = document.getElementById('nombre').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const zona = document.getElementById('zona').value.trim();
            const fecha = document.getElementById('fecha').value;
            const aceptaWhatsapp = document.getElementById('acepto').checked;

            if (!nombre || !telefono || !zona || !fecha || !aceptaWhatsapp) {
                alert('Por favor, completá todos los campos obligatorios y aceptá el contacto por WhatsApp.');
                return;
            }

            const servicio = document.getElementById('servicio').value;
            const franja = document.getElementById('franja').value;
            const descripcion = document.getElementById('descripcion').value.trim();

            // Detectar el tipo de propiedad seleccionado. Si no hay ninguno, indicarlo.
            const propiedadSeleccionada = document.querySelector('input[name="propiedad"]:checked');
            const propiedad = propiedadSeleccionada ? propiedadSeleccionada.value : 'No especificado';

            /*
             * Armado del mensaje de WhatsApp
             * Se utilizan saltos de línea (\n) para separar los datos de forma clara.
             * encodeURIComponent se encarga de codificar el mensaje para que los espacios
             * y caracteres especiales se vean correctamente en WhatsApp.
             */
            const mensaje = `Hola, quisiera solicitar un turno para fumigación.\n\n` +
                `Nombre y apellido: ${nombre}\n` +
                `Teléfono: ${telefono}\n` +
                `Zona / Localidad: ${zona}\n` +
                `Tipo de servicio: ${servicio}\n` +
                `Tipo de propiedad: ${propiedad}\n` +
                `Fecha preferida: ${fecha}\n` +
                `Franja horaria: ${franja}\n` +
                `Descripción del problema: ${descripcion || 'No indicado'}`;

            const telefonoEmpresa = '541136810124'; // Incluye código de país +54 y sin signos
            const urlWhatsapp = `https://wa.me/${telefonoEmpresa}?text=${encodeURIComponent(mensaje)}`;

            // Abrir el chat de WhatsApp en una nueva pestaña con el mensaje precargado
            window.open(urlWhatsapp, '_blank');
        });
    </script>
</body>
</html>
